<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Wave Elements (Positioned safely away from text) -->
  <g opacity="0.25">
    <path d="M-100,220 C150,150 350,280 600,200 C850,120 1050,250 1300,180" fill="none" stroke="#38bdf8" stroke-width="3">
      <animate attributeName="d" 
        values="M-100,220 C150,150 350,280 600,200 C850,120 1050,250 1300,180;
                M-100,200 C150,260 350,160 600,240 C850,140 1050,220 1300,200;
                M-100,220 C150,150 350,280 600,200 C850,120 1050,250 1300,180" 
        dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M-100,250 C200,280 400,180 700,250 C950,300 1100,160 1300,230" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="d" 
        values="M-100,250 C200,280 400,180 700,250 C950,300 1100,160 1300,230;
                M-100,230 C200,190 400,260 700,200 C950,180 1100,260 1300,210;
                M-100,250 C200,280 400,180 700,250 C950,300 1100,160 1300,230" 
        dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Glowing Network Nodes in background corners -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="100" cy="60" r="4">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="70" r="5">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="4">
      <animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Main Content (Title and Subtitle - Completely Unobscured) -->
  <g text-anchor="middle">
    <!-- Icon/Badge Graphic above text -->
    <rect x="560" y="45" width="80" height="32" rx="16" fill="url(#accentGradient)" opacity="0.9"/>
    <text x="600" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1.5">AWESOME</text>

    <!-- Main Title -->
    <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome CDN Analytics Platform
    </text>
    
    <!-- Title Underline Accent -->
    <rect x="450" y="155" width="300" height="4" rx="2" fill="url(#accentGradient)"/>

    <!-- Subtitle -->
    <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated List of SaaS Products &amp; Open-Source Projects for Real-Time Edge Analytics
    </text>
    
    <!-- Feature Pills in Foreground bottom -->
    <g transform="translate(360, 230)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
      <text x="70" y="18" fill="#38bdf8">⚡ Real-Time Logs</text>
      
      <!-- Pill 2 -->
      <rect x="170" y="0" width="140" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
      <text x="240" y="18" fill="#818cf8">📊 Traffic Metrics</text>
      
      <!-- Pill 3 -->
      <rect x="340" y="0" width="140" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
      <text x="410" y="18" fill="#c084fc">🛡️ Security Insights</text>
    </g>
  </g>
</svg>
